
{% extends "base.html" %}

{% block title %}Edit Task | TaskFlow{% endblock %}

{% block content %}

<div class="topbar">
    <div>
        <h1>Edit Task</h1>
        <p class="muted">Update your task details.</p>
    </div>

    <a href="{{ url_for('dashboard') }}" class="secondary-button">
        ← Back
    </a>
</div>

<section class="panel edit-panel">

    <form method="POST">

        <div class="field">
            <label>Task Title *</label>
            <input type="text" name="title"
                   value="{{ task.title }}" required
                   maxlength="150">
        </div>

        <div class="field">
            <label>Description</label>
            <textarea name="description" rows="5">{{ task.description or '' }}</textarea>
        </div>

        <div class="form-grid">

            <div class="field">
                <label>Priority</label>
                <select name="priority">
                    {% for p in ['Low','Medium','High'] %}
                    <option value="{{ p }}"
                    {% if task.priority == p %}selected{% endif %}>
                        {{ p }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label>Deadline</label>
                <input type="date" name="due_date"
                       value="{{ task.due_date or '' }}">
            </div>

            <div class="field">
                <label>Status</label>
                <select name="status">
                    {% for s in ['To Do','In Progress','Review','Completed'] %}
                    <option value="{{ s }}"
                    {% if task.status == s %}selected{% endif %}>
                        {{ s }}
                    </option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <button class="primary-button">Save Changes</button>

    </form>

</section>

{% endblock %}
